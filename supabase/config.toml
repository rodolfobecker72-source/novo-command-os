# As funções abaixo validam o usuário por conta própria (auth.getUser() com o
# token do chamador) e checam o papel no workspace, então não dependem da
# verificação de JWT do gateway (verify_jwt).

[functions.admin-overview]
verify_jwt = false

[functions.list-workspace-members]
verify_jwt = false

[functions.create-member]
verify_jwt = false

[functions.update-member-profile]
verify_jwt = false

[functions.delete-member]
verify_jwt = false

[functions.reset-user-password]
verify_jwt = false

# Google Agenda: as funções de usuário validam o login como as de cima; o
# worker é chamado pelo pg_cron e valida o segredo gcal_worker_secret (Vault).
[functions.google-calendar-connect-init]
verify_jwt = false

[functions.google-calendar-complete]
verify_jwt = false

[functions.google-calendar-status]
verify_jwt = false

[functions.google-calendar-disconnect]
verify_jwt = false

[functions.google-calendar-worker]
verify_jwt = false
